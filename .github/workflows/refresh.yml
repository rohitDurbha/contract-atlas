name: Refresh Contract Atlas
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contract-atlas-refresh
  cancel-in-progress: false
jobs:
  collect-and-publish:
    # Standard Linux runner in a PUBLIC repository; no paid/larger runners.
    if: github.ref == 'refs/heads/main'
    env:
      # Public project identifiers; only VERCEL_TOKEN is a credential.
      VERCEL_ORG_ID: team_Q3tFZbZwOv0nEhb9j6ptDpzP
      VERCEL_PROJECT_ID: prj_zGEobLETVmIkdYC702Ae84o2gpzE
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify public repository and free deployment scope
        env:
          PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test "$PUBLIC_REPOSITORY" = true
          for attempt in 1 2 3; do
            node scripts/assert-hobby.mjs && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Install dependencies with bounded retries
        run: |
          for attempt in 1 2 3; do
            npm ci && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Check code before collection
        run: npm run typecheck && npm test
      - name: Refresh persisted snapshot
        run: npm run collect:free
      - name: Check the snapshot
        run: npm run verify:free
      - name: Save real job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atlas.sqlite
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public contract-role snapshot"
            git push
          fi
      - name: Publish to Vercel Hobby
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            npx --yes vercel@63.1.0 deploy --prod --yes && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
      - name: Verify published feed
        run: |
          node --input-type=module <<'JS'
          import { DatabaseSync } from 'node:sqlite';
          const db=new DatabaseSync('data/atlas.sqlite',{readOnly:true});
          const expected=db.prepare('SELECT id FROM runs ORDER BY started_at DESC LIMIT 1').get().id;
          db.close();
          for(let attempt=0;attempt<6;attempt++) {
            try {
              const response=await fetch('https://contract-atlas-amber.vercel.app/api/overview',{signal:AbortSignal.timeout(20000)});
              if(!response.ok)throw new Error(`Overview HTTP ${response.status}`);
              const data=await response.json();
              if(data.lastRun?.id!==expected || data.totalJobs<1)throw new Error('Latest snapshot not yet visible');
              console.log('Verified published snapshot',expected);break;
            } catch(error) {
              if(attempt===5)throw error;
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
          }
          JS
